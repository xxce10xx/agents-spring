# Configuracion solo para los tests. Este fichero SUSTITUYE al de src/main/resources, no lo
# complementa, asi que tiene que declarar todo lo que el contexto necesita para arrancar.
#
# La idea es que ./mvnw test no dependa de ninguna infraestructura: H2 en lugar de MySQL, y Qdrant
# declarado pero sin tocarlo (no se crea la coleccion ni se indexan documentos).
spring:
  datasource:
    url: jdbc:h2:mem:sprintai;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  sql:
    init:
      # El mismo schema.sql de src/main: la tabla de auditoria se crea igual sobre H2, y por eso el
      # DDL evita tipos que solo entienda MySQL. Con H2 bastaria el valor por defecto (embedded), pero
      # se escribe para que quede claro que los tests prueban el esquema real y no otro.
      mode: always

  ai:
    openai:
      api-key: test-key
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: documentacion-corporativa
        # false -> no se conecta a Qdrant al arrancar el contexto
        initialize-schema: false

    # La conexion MCP se declara para que el contexto tenga su McpSyncClient, pero NADIE la usa
    # durante los tests: con initialized: false no hay handshake al arrancar, y con toolcallback
    # desactivado nadie pide el catalogo de herramientas. Ningun test llama al servidor MCP, asi que
    # ./mvnw test sigue sin necesitar mcp-procesos levantado.
    mcp:
      client:
        type: sync
        initialized: false
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            procesos:
              url: http://localhost:8082
              endpoint: /mcp

sprintai:
  search:
    top-k: 5
    umbral-similitud: 0.5
    # false -> no se indexa nada, no hace falta un Qdrant levantado
    cargar-documentos: false
